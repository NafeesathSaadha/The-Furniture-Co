<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Wishlist | The Furniture Co.</title>

  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">

  <style>
    .wishlist-container {
      max-width: 900px;
      margin: 40px auto;
      background: #fff;
      border-radius: 15px;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
      padding: 30px;
    }

    h2 {
      text-align: center;
      margin-bottom: 30px;
    }

    .wishlist-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid #ddd;
      padding: 15px 0;
    }

    .wishlist-item img {
      width: 120px;
      height: 120px;
      object-fit: contain;
      border-radius: 10px;
      background: #f0f0f0;
    }

    .item-details {
      flex: 1;
      margin-left: 20px;
    }

    .item-details h3 {
      margin: 0 0 8px;
      font-size: 18px;
    }

    .actions button {
      margin-left: 10px;
      padding: 8px 14px;
      border-radius: 8px;
      border: none;
      cursor: pointer;
      font-size: 14px;
    }

    .move-btn {
      background-color: #5c4033;
      color: #fff;
    }

    .remove-btn {
      background-color: #5c4033;
      color: #fff;
    }

    .empty {
      text-align: center;
      color: #777;
      margin-top: 30px;
    }
  </style>
</head>

<body>

  <div class="heading-container">
    <h1>The Furniture Co.</h1>
    <h4 class="tagline">Where elegance meets every corner of your home.</h4>
  </div>

  <nav class="bar">
    <a href="login.html">Login</a>
    <a href="index.html">Home</a>
    <a href="wishlist.html">Wishlist</a>
    <a href="cart.html">Cart</a>
    <a href="about.html">About</a>
    <a href="contact.html">Contact us</a>
  </nav>

  <div class="wishlist-container">
    <h3>Your Wishlist</h3>
    <div id="wishlist-items"></div>
  </div>

  <script>
    let wishlist = JSON.parse(localStorage.getItem("wishlist")) || [];
    let cart = JSON.parse(localStorage.getItem("cart")) || [];

    const wishlistContainer = document.getElementById("wishlist-items");

    function renderWishlist() {
      wishlistContainer.innerHTML = "";

      if (wishlist.length === 0) {
        wishlistContainer.innerHTML = "<p class='empty'>Your wishlist is empty.</p>";
        return;
      }

      wishlist.forEach((item, index) => {
        const div = document.createElement("div");
        div.className = "wishlist-item";

        div.innerHTML = `
          <img src="${item.image}" alt="${item.name}">
          <div class="item-details">
            <h3>${item.name}</h3>
          </div>
          <div class="actions">
            <button class="move-btn" onclick="moveToCart(${index})">Move to Cart</button>
            <button class="remove-btn" onclick="removeFromWishlist(${index})">Remove</button>
          </div>
        `;

        wishlistContainer.appendChild(div);
      });
    }

    function moveToCart(index) {
      const product = wishlist[index];

      // avoid duplicates in cart
      const exists = cart.some(item => item.name === product.name);
      if (!exists) {
        cart.push(product);
        localStorage.setItem("cart", JSON.stringify(cart));
      }

      wishlist.splice(index, 1);
      localStorage.setItem("wishlist", JSON.stringify(wishlist));

      renderWishlist();
    }

    function removeFromWishlist(index) {
      wishlist.splice(index, 1);
      localStorage.setItem("wishlist", JSON.stringify(wishlist));
      renderWishlist();
    }

    renderWishlist();
  </script>

</body>
</html>
